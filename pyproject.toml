# Project manifest exists for ONE reason: to configure the gate (ruff / mypy / pytest).
# It deliberately declares no dependencies and no build backend.
#
# Ceiling: dependencies stay per-script `uv run --with ...` (see VERIFICATION.md §3)
# until something actually needs a shared, locked environment. Adding a resolver and a
# lockfile before there is an app to lock would be scaffolding for later.

[project]
name = "outmarket-dq"
version = "0.0.0"
description = "AI-powered data quality assistant — gate configuration only, not a distributable package"
requires-python = ">=3.12"

# ---------------------------------------------------------------------------
# ruff — lint + format. Installed globally (0.6.1); no install needed.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
# Gate scope. `learning-tests/` and `seed/` are DELIBERATELY excluded: they are
# one-shot empirical scripts whose findings live in their docstrings, already
# written before the gate existed, and re-flowing them would destroy the
# provenance the take-home is graded on. See VERIFICATION.md §3 for the exact
# count of findings that exclusion hides — it is visible, not silent.
extend-exclude = ["learning-tests", "seed", ".claude"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes — includes dead-code signals: F401 unused import, F841 unused variable
    "I",        # import sorting
    "UP",       # pyupgrade
    "B",        # bugbear
    "C90",      # mccabe complexity  -> the function-complexity threshold
    "PLR0912",  # too many branches
    "PLR0913",  # too many arguments
    "PLR0915",  # too many statements -> the function-size threshold
]

# No [tool.ruff.lint.mccabe] / [tool.ruff.lint.pylint] tables: the codes selected
# above already enforce ruff's defaults (complexity 10, branches 12, statements 50,
# args 5). Restating a default changes nothing and rots when the default moves.

# ---------------------------------------------------------------------------
# mypy — typecheck. Installed globally (1.19.1); no install needed.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true          # great_expectations / playwright ship no usable stubs
warn_unused_ignores = true
warn_redundant_casts = true
exclude = "^(learning-tests|seed)/"

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# ---------------------------------------------------------------------------
# pytest — the single runner for unit, invariant, and browser layers.
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
# The repo root on sys.path, so `from app import model` resolves under a bare
# `pytest` as well as under `python -m pytest`. Without it only the latter works
# (it puts CWD on the path; pytest's own prepend mode adds tests/, not the root)
# and the gate would pass or fail depending on how it was invoked.
pythonpath = ["."]
# -ra prints the reason for every skip: that is how a PENDING check stays visible
# instead of disappearing into a green dot.
# --strict-markers turns a mistyped marker into a collection error instead of a
# warning. Without it `@pytest.mark.e2ee` is NOT deselected by `-m "not ge and not
# e2e"`, so one keystroke puts a browser or network check inside `make check` —
# breaking the three promises in the Makefile header, silently.
addopts = "-ra --strict-markers"
markers = [
    "ge: needs a reachable database and (for all but the F15 seed checks) great_expectations — never part of `make check`; run via the `uv run` line in VERIFICATION.md §1",
    "e2e: drives the running app with a browser — needs APP_URL",
    "live: makes a real, billed call to the model — never part of `make check`; run via the command in tests/test_model_sandbox.py",
]
# `blocked_lt1b` is gone: LT-1b landed and every check it gated is now designed
# (VERIFICATION.md §9). A marker for a resolved blocker is a place for a stub to hide.

[tool.ruff.lint.isort]
# `conftest` is imported by path, not as a package. Tell isort it is ours.
known-first-party = ["app", "conftest"]
